<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SecondScreen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SecondScreen">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="icon.svg" alt="" width="22" height="22"><h1>SecondScreen</h1></div>
      <span class="ph-sp"></span>
      <button type="button" id="btn-addcol" class="btn" hidden title="Add a column on the right"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8"/><path d="M8 12h8"/></svg><span>Column</span></button>
      <button type="button" id="btn-edit" class="btn" aria-pressed="false">Edit layout</button>
      <button type="button" id="btn-awake" class="btn icon-only" title="Keep screen awake" aria-label="Keep screen awake" aria-pressed="false"></button>
      <button type="button" id="btn-fs" class="btn icon-only" title="Enter fullscreen" aria-label="Enter fullscreen" aria-pressed="false" hidden></button>
      <button type="button" id="btn-layouts" class="btn icon-only" title="Layouts" aria-label="Layouts menu" aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></button>
      <div id="status" class="status offline" title="Connection status"><span class="dot"></span><span id="status-text">Connecting</span></div>
    </header>

    <nav id="tabs" class="tabs" role="tablist" aria-label="Panels" hidden></nav>

    <main id="stage"></main>
  </div>

  <dialog id="token-dialog">
    <form method="dialog" id="token-form">
      <h2>Access token required</h2>
      <p>Open the URL shown in the SecondScreen settings window in-game, or paste the token here.</p>
      <input id="token-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="token">
      <button type="submit">Connect</button>
    </form>
  </dialog>

  <dialog id="share-dialog" class="share">
    <h2>Export / import layout</h2>
    <p>Copy this JSON to use the layout on another device, or paste a layout here and apply it.</p>
    <textarea spellcheck="false" autocomplete="off" autocapitalize="off" rows="12" aria-label="Layout JSON"></textarea>
    <div class="share-err" hidden></div>
    <div class="row">
      <button type="button" class="btn" data-close>Close</button>
      <span class="ph-sp"></span>
      <button type="button" class="btn" data-copy>Copy</button>
      <button type="button" class="btn primary" data-apply>Apply</button>
    </div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
